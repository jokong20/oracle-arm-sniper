name: Oracle ARM Instance Sniper
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  sniper:
    name: ARM Instance Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false

    env:
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_FP: ${{ secrets.FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      SSH_PUB_KEY: ${{ secrets.USER_SSH_PUB_KEY }}

    steps:
      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Oracle ARM Sniper
        run: |
          set -e
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True

          # ========== 环境变量诊断 ==========
          echo "=== ENV DIAGNOSTICS ==="
          echo "OCI_USER       len=${#OCI_USER}   ok=$([ -n \"${OCI_USER}\" ] && echo YES || echo NO)"
          echo "OCI_TENANCY    len=${#OCI_TENANCY}   ok=$([ -n \"${OCI_TENANCY}\" ] && echo YES || echo NO)"
          echo "OCI_FP         len=${#OCI_FP}   ok=$([ -n \"${OCI_FP}\" ] && echo YES || echo NO)"
          echo "OCI_REGION     len=${#OCI_REGION}   ok=$([ -n \"${OCI_REGION}\" ] && echo YES || echo NO)"
          echo "SUBNET_ID      len=${#SUBNET_ID}   ok=$([ -n \"${SUBNET_ID}\" ] && echo YES || echo NO)"
          echo "========================"
          if [ -z "${OCI_TENANCY}" ]; then
            echo ""
            echo "[FATAL] env OCI_TENANCY is empty!"
            echo "[HINT]  Secret name mismatch. Check GitHub repo →"
            echo "        Settings → Secrets → Actions for exact name."
            echo "        Must be: TENANCY_OCID (all caps, underscore)"
            exit 1
          fi
          if [ -z "${OCI_USER}" ]; then
            echo "[FATAL] env OCI_USER is empty!"
            exit 1
          fi
          echo ""

          # 写入 OCI 配置文件（直接用 printf，不用 heredoc/sed）
          mkdir -p $HOME/.oci
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s/.oci/key.pem\n' \
            "${OCI_USER}" "${OCI_FP}" "${OCI_TENANCY}" "${OCI_REGION}" "${HOME}" \
            > $HOME/.oci/config
          echo "${OCI_PRIVATE_KEY}" > $HOME/.oci/key.pem
          chmod 600 $HOME/.oci/key.pem $HOME/.oci/config

          echo "=== OCI Config File ==="
          grep -v "key_file" $HOME/.oci/config
          echo "======================="
          echo ""

          # ========== OCID 字节级诊断 ==========
          echo "=== OCID BYTES (first 60 hex) ==="
          echo -n "${OCI_TENANCY}" | od -A x -t x1z | head -6
          echo ""
          echo "=== TEST 1: compartment get (path param) ==="
          oci iam compartment get --compartment-id "${OCI_TENANCY}" 2>&1 || true
          echo ""
          echo "=== TEST 2: compartment list (query param, same as AD list) ==="
          oci iam compartment list --compartment-id "${OCI_TENANCY}" --limit 1 2>&1 || true
          echo ""
          echo "=== TEST 3: availability-domain list ==="
          oci iam availability-domain list --compartment-id "${OCI_TENANCY}" 2>&1 || true
          echo ""
          echo "======================================="
          echo ""

          # SSH
          mkdir -p $HOME/.ssh
          echo "${SSH_PUB_KEY}" > $HOME/.ssh/id_rsa_oracle.pub

          # 主逻辑
          START_TIME=$(date +%s)
          MAX_RUNTIME=2700

          AD_LIST=$(oci iam availability-domain list \
            --compartment-id "${OCI_TENCANCY}" \
            --query "data[*].name" \
            --raw-output | jq -r '.[]' | sort)

          IMAGE_ID=$(oci compute image list \
            --compartment-id "${OCI_TENCANCY}" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" \
            --query 'data[0].id' \
            --raw-output)

          echo "=== Oracle ARM Sniper ==="
          echo "[AD] 可用域: $(echo $AD_LIST | tr '\n' ' ')"
          echo "[IMG] 镜像 ID: ${IMAGE_ID}"
          echo "[CONFIG] 2C 12G ARM / 140G 存储"
          echo ""

          EXISTING=$(oci compute instance list \
            --compartment-id "${OCI_TENCANCY}" \
            --lifecycle-state RUNNING,PROVISIONING \
            --query "data[].\"display-name\"" \
            --raw-output 2>/dev/null | grep -c "SNIPER-" || echo "0")

          if [ "${EXISTING}" != "0" ] && [ "${EXISTING}" != "" ]; then
            echo "[SKIP] 已有 SNIPER 实例存在中，跳过本轮"
            exit 0
          fi

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - START_TIME ))

            if [ $ELAPSED -gt $MAX_RUNTIME ]; then
              echo "[TIMEOUT] 已运行 45 分钟，安全退出"
              exit 0
            fi

            for ad in $AD_LIST; do
              echo "[$(date +%H:%M:%S)] 尝试 $ad | 已运行 ${ELAPSED}s"

              if oci compute instance launch \
                --availability-domain "$ad" \
                --compartment-id "${OCI_TENCANCY}" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                --boot-volume-size-in-gbs 140 \
                --image-id "$IMAGE_ID" \
                --subnet-id "${SUBNET_ID}" \
                --ssh-authorized-keys-file $HOME/.ssh/id_rsa_oracle.pub \
                --assign-public-ip true \
                --display-name "SNIPER-$(date +%m%d_%H%M)" \
                >/dev/null 2>&1; then

                echo ""
                echo "============================================"
                echo "  [SUCCESS] ARM 2C12G / 140G 实例创建成功！"
                echo "  可用域: $ad"
                echo "  时间: $(date)"
                echo "============================================"
                echo ""

                sleep 15
                INSTANCE_ID=$(oci compute instance list \
                  --compartment-id "${OCI_TENCANCY}" \
                  --lifecycle-state PROVISIONING,RUNNING \
                  --sort-by TIMECREATED \
                  --sort-order DESC \
                  --limit 1 \
                  --query "data[0].id" \
                  --raw-output 2>/dev/null)

                if [ -n "$INSTANCE_ID" ]; then
                  echo "[INFO] 实例 ID: $INSTANCE_ID"
                  PUBLIC_IP=$(oci compute instance list-vnics \
                    --instance-id "$INSTANCE_ID" \
                    --query "data[0].\"public-ip\"" \
                    --raw-output 2>/dev/null)
                  echo "[INFO] 公网 IP: $PUBLIC_IP"
                  echo "[INFO] SSH 登录: ssh ubuntu@$PUBLIC_IP"
                fi

                exit 0
              else
                echo "  $ad: 暂无资源"
              fi

              sleep 5
            done

            echo "[$(date +%H:%M:%S)] 本轮全部失败，30 秒后重试..."
            sleep 30
          done
