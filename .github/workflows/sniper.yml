name: Oracle ARM Instance Sniper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-arm-sniper-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sniper:
    name: ARM Instance Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_FP: ${{ secrets.FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      SSH_PUB_KEY: ${{ secrets.USER_SSH_PUB_KEY }}

    steps:
      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output install-oci-cli.sh \
            https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x install-oci-cli.sh
          ./install-oci-cli.sh --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Launch ARM instance
        shell: bash
        run: |
          set -Eeuo pipefail
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True

          # Do not print secret values. Lengths are safe diagnostics for missing Secrets.
          echo '=== ENV DIAGNOSTICS ==='
          for name in OCI_USER OCI_TENANCY OCI_REGION OCI_FP SUBNET_ID SSH_PUB_KEY OCI_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              echo "$name: set (length ${#value})"
            else
              echo "$name: MISSING"
            fi
          done
          echo '======================='

          for name in OCI_USER OCI_TENANCY OCI_REGION OCI_FP OCI_PRIVATE_KEY SUBNET_ID SSH_PUB_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "[FATAL] Missing GitHub Secret for $name"
              exit 1
            fi
          done

          # GitHub multiline Secrets can contain CRLF line endings. Normalize only locally.
          OCI_USER="${OCI_USER//$'\r'/}"
          OCI_TENANCY="${OCI_TENANCY//$'\r'/}"
          OCI_REGION="${OCI_REGION//$'\r'/}"
          OCI_FP="${OCI_FP//$'\r'/}"
          SUBNET_ID="${SUBNET_ID//$'\r'/}"
          SSH_PUB_KEY="${SSH_PUB_KEY//$'\r'/}"
          OCI_PRIVATE_KEY="${OCI_PRIVATE_KEY//$'\r'/}"

          mkdir -p "$HOME/.oci" "$HOME/.ssh"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" "$OCI_REGION" "$HOME/.oci/key.pem" \
            > "$HOME/.oci/config"
          printf '%s\n' "$SSH_PUB_KEY" > "$HOME/.ssh/id_rsa_oracle.pub"
          chmod 600 "$HOME/.oci/key.pem" "$HOME/.oci/config"
          chmod 644 "$HOME/.ssh/id_rsa_oracle.pub"

          # Fail early if a pasted key is malformed.
          openssl pkey -in "$HOME/.oci/key.pem" -noout >/dev/null
          ssh-keygen -lf "$HOME/.ssh/id_rsa_oracle.pub" >/dev/null

          echo '=== OCI AUTH CHECK ==='
          oci iam availability-domain list \
            --compartment-id "$OCI_TENANCY" \
            --query 'data[].name' \
            --output json > /tmp/ad.json
          mapfile -t AD_LIST < <(jq -r '.[]' /tmp/ad.json)
          if (( ${#AD_LIST[@]} == 0 )); then
            echo '[FATAL] No availability domains were returned.'
            exit 1
          fi
          printf '[AD] %s\n' "${AD_LIST[*]}"

          # Use the latest matching Canonical Ubuntu 24.04 ARM image.
          IMAGE_ID=$(oci compute image list \
            --compartment-id "$OCI_TENANCY" \
            --operating-system 'Canonical Ubuntu' \
            --operating-system-version '24.04' \
            --shape 'VM.Standard.A1.Flex' \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --query 'data[0].id' \
            --raw-output)
          if [[ -z "$IMAGE_ID" || "$IMAGE_ID" == 'null' ]]; then
            echo '[FATAL] No Ubuntu 24.04 ARM image was found.'
            exit 1
          fi
          echo '[IMG] Ubuntu 24.04 ARM image found.'

          # Prevent a later scheduled run from creating a second SNIPER instance.
          oci compute instance list \
            --compartment-id "$OCI_TENANCY" \
            --all \
            --output json > /tmp/instances.json
          EXISTING_ID=$(jq -r '
            first(
              .data[]
              | select((."display-name" // "") | startswith("SNIPER-"))
              | select((."lifecycle-state" // "") != "TERMINATED")
              | select((."lifecycle-state" // "") != "TERMINATING")
              | .id
            ) // empty
          ' /tmp/instances.json)
          if [[ -n "$EXISTING_ID" && "$EXISTING_ID" != 'null' ]]; then
            echo '[SKIP] A SNIPER instance already exists.'
            echo "[INFO] Instance ID: $EXISTING_ID"
            exit 0
          fi

          START_TIME=$(date +%s)
          MAX_RUNTIME=2700

          # Keep each AD request idempotent. If OCI accepts a launch but the CLI
          # times out before receiving the response, the next retry must not
          # create a duplicate instance.
          declare -A RETRY_TOKENS
          declare -A DISPLAY_NAMES

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            if (( ELAPSED >= MAX_RUNTIME )); then
              echo '[TIMEOUT] Reached the 45-minute limit; exiting safely.'
              exit 0
            fi

            for ad in "${AD_LIST[@]}"; do
              if [[ -z "${RETRY_TOKENS[$ad]:-}" ]]; then
                RETRY_TOKENS["$ad"]=$(cat /proc/sys/kernel/random/uuid)
                DISPLAY_NAMES["$ad"]="SNIPER-$(date +%m%d_%H%M%S)"
              fi

              echo "[TRY] $ad | elapsed ${ELAPSED}s"
              ERROR_FILE=$(mktemp)
              set +e
              LAUNCH_JSON=$(oci compute instance launch \
                --availability-domain "$ad" \
                --compartment-id "$OCI_TENANCY" \
                --shape 'VM.Standard.A1.Flex' \
                --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                --boot-volume-size-in-gbs 140 \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --ssh-authorized-keys-file "$HOME/.ssh/id_rsa_oracle.pub" \
                --assign-public-ip true \
                --display-name "${DISPLAY_NAMES[$ad]}" \
                --opc-retry-token "${RETRY_TOKENS[$ad]}" \
                --output json 2>"$ERROR_FILE")
              RC=$?
              set -e

              if (( RC == 0 )); then
                INSTANCE_ID=$(printf '%s' "$LAUNCH_JSON" | jq -r '.data.id // empty')
                if [[ -z "$INSTANCE_ID" ]]; then
                  echo '[FATAL] Launch returned success but no instance ID.'
                  exit 1
                fi
                echo "[SUCCESS] Instance launch accepted in $ad"
                echo "[INFO] Instance ID: $INSTANCE_ID"
                rm -f "$ERROR_FILE"
                exit 0
              fi

              ERROR_TEXT=$(tr '\n' ' ' < "$ERROR_FILE")
              rm -f "$ERROR_FILE"
              if grep -Eqi 'out[ -]of[ -](host )?capacity|OutOfHostCapacity' <<< "$ERROR_TEXT"; then
                echo "[RETRY] $ad has no available capacity."
              elif grep -Eqi 'too many requests|TooManyRequests|service unavailable|ServiceUnavailable|RequestException|connection .*timed out|read timed out|connect timeout|connection (reset|aborted|refused)|remote end closed|network is unreachable|temporary failure|name or service not known|could not resolve' <<< "$ERROR_TEXT"; then
                echo "[RETRY] Transient OCI/network error in $ad."
                echo "[INFO] $ERROR_TEXT"
              else
                echo "[FATAL] OCI launch failed: $ERROR_TEXT"
                exit "$RC"
              fi
              sleep 5
            done
            echo '[RETRY] All availability domains failed; retrying in 30 seconds.'
            sleep 30
          done

