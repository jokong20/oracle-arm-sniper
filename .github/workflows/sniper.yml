name: Oracle ARM Instance Sniper
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  sniper:
    name: ARM Instance Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false

    env:
      OCI_USER: ${{ secrets.USER_OCID }}
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_FP: ${{ secrets.FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      SSH_PUB_KEY: ${{ secrets.USER_SSH_PUB_KEY }}

    steps:
      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Oracle ARM Sniper
        run: |
          set -e
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True

          # ---- 写入 OCI 配置文件 ----
          mkdir -p $HOME/.oci
          cat > $HOME/.oci/config <<OCICFG
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FP}
          tenancy=${OCI_TENCANCY}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/key.pem
          OCICFG
          echo "${OCI_PRIVATE_KEY}" > $HOME/.oci/key.pem
          chmod 600 $HOME/.oci/key.pem $HOME/.oci/config

          # ---- 调试：打印配置文件内容（隐藏密钥）----
          echo "=== 调试：OCI 配置文件内容 ==="
          grep -v "key_file" $HOME/.oci/config
          echo "[tenancy 长度: $(echo -n "${OCI_TENCANCY}" | wc -c)]"
          echo "[tenancy 前16字符: ${OCI_TENCANCY:0:16}]"
          echo "============================="
          echo ""

          # ---- 校验 tenancy 格式 ----
          case "${OCI_TENCANCY}" in
            ocid1.tenancy.*) ;;
            *) echo "[FATAL] TENANCY_OCID 不是合法的租户 OCID, 以 ocid1.tenancy. 开头"; exit 1 ;;
          esac

          # ---- SSH 配置 ----
          mkdir -p $HOME/.ssh
          echo "${SSH_PUB_KEY}" > $HOME/.ssh/id_rsa_oracle.pub

          # ---- 主逻辑 ----
          START_TIME=$(date +%s)
          MAX_RUNTIME=2700

          AD_LIST=$(oci iam availability-domain list \
            --compartment-id "${OCI_TENCANCY}" \
            --query "data[*].name" \
            --raw-output | jq -r '.[]' | sort)

          IMAGE_ID=$(oci compute image list \
            --compartment-id "${OCI_TENCANCY}" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" \
            --query 'data[0].id' \
            --raw-output)

          echo "=== Oracle ARM Sniper ==="
          echo "[AD] 可用域: $(echo $AD_LIST | tr '\n' ' ')"
          echo "[IMG] 镜像 ID: ${IMAGE_ID}"
          echo "[CONFIG] 2C 12G ARM / 140G 存储"
          echo ""

          # 检查是否已有 SNIPER 实例
          EXISTING=$(oci compute instance list \
            --compartment-id "${OCI_TENCANCY}" \
            --lifecycle-state RUNNING,PROVISIONING \
            --query "data[].\"display-name\"" \
            --raw-output 2>/dev/null | grep -c "SNIPER-" || echo "0")

          if [ "${EXISTING}" != "0" ] && [ "${EXISTING}" != "" ]; then
            echo "[SKIP] 已有 SNIPER 实例存在中，跳过本轮"
            exit 0
          fi

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - START_TIME ))

            if [ $ELAPSED -gt $MAX_RUNTIME ]; then
              echo "[TIMEOUT] 已运行 45 分钟，安全退出"
              exit 0
            fi

            for ad in $AD_LIST; do
              echo "[$(date +%H:%M:%S)] 尝试 $ad | 已运行 ${ELAPSED}s"

              if oci compute instance launch \
                --availability-domain "$ad" \
                --compartment-id "${OCI_TENCANCY}" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                --boot-volume-size-in-gbs 140 \
                --image-id "$IMAGE_ID" \
                --subnet-id "${SUBNET_ID}" \
                --ssh-authorized-keys-file $HOME/.ssh/id_rsa_oracle.pub \
                --assign-public-ip true \
                --display-name "SNIPER-$(date +%m%d_%H%M)" \
                >/dev/null 2>&1; then

                echo ""
                echo "============================================"
                echo "  [SUCCESS] ARM 2C12G / 140G 实例创建成功！"
                echo "  可用域: $ad"
                echo "  时间: $(date)"
                echo "============================================"
                echo ""

                sleep 15
                INSTANCE_ID=$(oci compute instance list \
                  --compartment-id "${OCI_TENCANCY}" \
                  --lifecycle-state PROVISIONING,RUNNING \
                  --sort-by TIMECREATED \
                  --sort-order DESC \
                  --limit 1 \
                  --query "data[0].id" \
                  --raw-output 2>/dev/null)

                if [ -n "$INSTANCE_ID" ]; then
                  echo "[INFO] 实例 ID: $INSTANCE_ID"
                  PUBLIC_IP=$(oci compute instance list-vnics \
                    --instance-id "$INSTANCE_ID" \
                    --query "data[0].\"public-ip\"" \
                    --raw-output 2>/dev/null)
                  echo "[INFO] 公网 IP: $PUBLIC_IP"
                  echo "[INFO] SSH 登录: ssh ubuntu@$PUBLIC_IP"
                fi

                exit 0
              else
                echo "  $ad: 暂无资源"
              fi

              sleep 5
            done

            echo "[$(date +%H:%M:%S)] 本轮全部失败，30 秒后重试..."
            sleep 30
          done
